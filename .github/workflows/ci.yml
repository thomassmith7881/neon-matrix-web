name: Web Lint & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML and assets structure
        run: |
          test -f index.html && echo "index.html exists."
          test -f style.css && echo "style.css exists."
          test -f app.js && echo "app.js exists."
          echo "Web structure validated."
